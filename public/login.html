<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clix - Login</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="login-container">
        <h1>Clix</h1>
        <p>Descubra o clima em tempo real</p>

        <form id="login-form">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="paulo@email.com" required>
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required>
            </div>

            <button type="submit" class="login-btn" id="login-btn">Entrar</button>

            <div id="login-error" class="error-message">Usuário ou senha incorretos!</div>
        </form>
    </div>

    <script src="js/login.js"></script>
</body>

</html>
